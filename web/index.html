<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <title>Reference Book Recommender System</title>
</head>
<body>
    <div class="header">
        <h1 class="text-center">Reference Book Recommender System</h1>
        <h5 class="text-center">Select Language and Difficulty</h5>
    </div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="language-select" class="form-label">Select Language</label>
                    <select class="form-select" id="language-select">
                        <option value="Java">Java</option>
                        <option value="Python">Python</option>
                        <option value="C++">C++</option>
                        <option value="HTML">HTML</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="difficulty-select" class="form-label">Select Difficulty</label>
                    <select class="form-select" id="difficulty-select">
                        <option value="Beginner">Beginner</option>
                        <option value="Intermediate">Intermediate</option>
                        <option value="Advanced">Advanced</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    <div class="button-container text-center">
        <button type="button" class="btn btn-primary" onclick="getRecommendation()">Get Recommendation</button>
    </div>
    <div id="recommendation" class="recommendation mt-3"></div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
